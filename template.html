<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastel do Michel · Cardápio</title>
<meta name="description" content="Cardápio do Pastel do Michel: pastéis, salgados, assados, lanches no pão francês, sucos e bebidas.">
<meta name="theme-color" content="#9E2A1F">
<meta property="og:title" content="Pastel do Michel · Cardápio">
<meta property="og:image" content="fotos/capa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#9E2A1F; --vermelho-esc:#6E1B13; --laranja:#E8892B; --amarelo:#F6C21C;
  --creme:#FFF6E8; --papel:#FFFDF8; --tinta:#2A1410; --suave:#7A5A4E; --linha:#EAD9C4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--creme);color:var(--tinta);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}

/* topo */
.topo{position:relative;overflow:hidden;color:#fff;padding:28px 16px 34px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%, #F29A3A 0%, var(--laranja) 35%, var(--vermelho) 100%)}
.topo::before{content:"CARDÁPIO CARDÁPIO CARDÁPIO CARDÁPIO";position:absolute;inset:-10px -40px auto;font-family:"Lilita One";
  font-size:64px;line-height:.9;color:rgba(110,27,19,.18);white-space:normal;word-break:break-all;transform:rotate(-6deg);pointer-events:none}
.selo{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--amarelo);border:5px solid var(--vermelho-esc);border-radius:50%/50%;padding:14px 30px 12px;
  box-shadow:0 8px 0 rgba(0,0,0,.15)}
.selo b{font-family:"Lilita One";font-weight:400;font-size:30px;line-height:.9;color:#fff;
  -webkit-text-stroke:5px var(--vermelho-esc);paint-order:stroke fill}
.selo b + b{font-size:40px;color:var(--vermelho);-webkit-text-stroke:0;letter-spacing:.02em}
.topo p{position:relative;margin-top:14px;font-family:"Barlow Condensed";font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;opacity:.95}

/* navegação */
nav{position:sticky;top:0;z-index:5;background:var(--vermelho);box-shadow:0 2px 10px rgba(0,0,0,.18)}
nav ul{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;list-style:none;scrollbar-width:none}
nav ul::-webkit-scrollbar{display:none}
nav a{display:block;white-space:nowrap;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;
  font-family:"Barlow Condensed";font-weight:600;font-size:16px;letter-spacing:.03em;text-decoration:none;text-transform:uppercase}
nav a.ativo{background:var(--amarelo);color:var(--vermelho-esc)}

main{max-width:760px;margin:0 auto;padding:8px 16px 40px}

/* destaques */
.destaques{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 6px}
@media (min-width:560px){.destaques{grid-template-columns:1fr 1fr}}
.card{scroll-margin-top:80px;background:var(--papel);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(110,27,19,.12);
  text-decoration:none;color:inherit;display:block}
.card .ft{aspect-ratio:3/2;overflow:hidden;background:#1a1a1a}
.card .ft img{width:100%;height:100%;object-fit:cover}
.card .tx{padding:12px 14px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{font-family:"Barlow Condensed";font-weight:700;font-size:22px;line-height:1.05;text-transform:uppercase}
.card .ds{display:block;color:var(--suave);font-size:14px;margin-top:3px}

/* seções */
section{scroll-margin-top:72px;margin-top:26px}
section h2{font-family:"Lilita One";font-weight:400;font-size:30px;color:var(--vermelho);letter-spacing:.01em;
  display:flex;align-items:center;gap:10px}
section h2::after{content:"";flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--laranja),transparent)}
.lista{list-style:none;margin-top:8px;background:var(--papel);border-radius:16px;padding:4px 14px;box-shadow:0 4px 14px rgba(110,27,19,.08)}
.item{scroll-margin-top:84px;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--linha);
  border-radius:10px;transition:background .4s}
.item:last-child{border-bottom:0}
.item .mini{flex:none;width:56px;height:56px;border-radius:12px;overflow:hidden;background:#222}
.item .mini img{width:100%;height:100%;object-fit:cover}
.item .nm{flex:1;min-width:0}
.item h3{font-family:"Barlow Condensed";font-weight:600;font-size:19px;line-height:1.1}
.item p{color:var(--suave);font-size:14px;margin-top:2px}
.preco{flex:none;font-family:"Barlow Condensed";font-weight:700;font-size:20px;color:var(--vermelho-esc);
  background:var(--amarelo);border-radius:10px;padding:3px 10px;white-space:nowrap}
.preco small{font-size:13px;font-weight:600;margin-right:2px}
.preco.consultar{background:var(--linha);color:var(--suave);font-size:15px}
.item.alvo{background:#FFE9A8;padding-left:10px;padding-right:10px;margin:0 -10px}

/* destaque do QR */
.foco{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(30,10,6,.55);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.foco.on{display:flex}
.folha{width:100%;max-width:560px;background:var(--papel);border-radius:22px 22px 0 0;overflow:hidden;
  animation:sobe .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.foco{align-items:center}.folha{border-radius:22px}}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.folha .ft{aspect-ratio:3/2;background:#1a1a1a}
.folha .ft img{width:100%;height:100%;object-fit:cover}
.folha .sem{display:flex;align-items:center;justify-content:center;aspect-ratio:auto;padding:26px;
  background:radial-gradient(120% 100% at 50% 0%, var(--laranja), var(--vermelho));color:#fff;font-family:"Lilita One";font-size:26px}
.folha .tx{padding:16px 18px 6px}
.folha .cat{font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--laranja)}
.folha h3{font-family:"Lilita One";font-weight:400;font-size:32px;line-height:1;color:var(--vermelho);margin-top:2px}
.folha p{color:var(--suave);margin-top:6px}
.folha .linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 18px}
.folha .preco{font-size:28px;padding:4px 14px}
.btn{appearance:none;border:0;cursor:pointer;font-family:"Barlow Condensed";font-weight:700;font-size:18px;letter-spacing:.03em;
  text-transform:uppercase;background:var(--vermelho);color:#fff;border-radius:12px;padding:12px 16px}

footer{text-align:center;color:var(--suave);font-size:14px;padding:10px 16px 40px}
footer b{font-family:"Lilita One";font-weight:400;color:var(--vermelho);font-size:20px;display:block}
</style>
</head>
<body>
<header class="topo">
  <div class="selo"><b>Pastel do</b><b>MICHEL</b></div>
  <p>Cardápio</p>
</header>
<nav><ul id="nav"></ul></nav>
<main id="app"></main>
<footer><b>Pastel do Michel</b>Preços sujeitos a alteração. Peça no balcão.</footer>

<div class="foco" id="foco" role="dialog" aria-modal="true">
  <div class="folha" id="folha"></div>
</div>

<script>
const DADOS = /*DADOS*/null;
const $ = s => document.querySelector(s);
const brl = v => v == null ? null : v.toFixed(2).replace(".", ",");
const preco = v => v == null ? '<span class="preco consultar">Consultar</span>'
  : `<span class="preco"><small>R$</small>${brl(v)}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const porId = {};

function montar(){
  const nav = [], html = [];
  const dest = [];
  for (const c of DADOS.categorias) {
    nav.push(`<li><a href="#${c.id}" data-sec="${c.id}">${esc(c.nome)}</a></li>`);
    const itens = c.itens.map(i => {
      porId[i.id] = {...i, cat: c.nome};
      if (i.destaque) dest.push(i);
      return `<li class="item" id="${i.id}">
        ${i.foto ? `<div class="mini"><img loading="lazy" src="fotos/${i.foto}" alt=""></div>` : ""}
        <div class="nm"><h3>${esc(i.nome)}</h3>${i.desc ? `<p>${esc(i.desc)}</p>` : ""}</div>
        ${preco(i.preco)}</li>`;
    }).join("");
    html.push(`<section id="${c.id}"><h2>${esc(c.nome)}</h2><ul class="lista">${itens}</ul></section>`);
  }
  const cards = dest.map(i => `<a class="card" href="#${i.id}" data-abre="${i.id}">
      <div class="ft"><img src="fotos/${i.foto}" alt="${esc(i.nome)}"></div>
      <div class="tx"><div><h3>${esc(i.nome)}</h3>${i.desc ? `<span class="ds">${esc(i.desc)}</span>` : ""}</div>${preco(i.preco)}</div></a>`).join("");
  $("#nav").innerHTML = nav.join("");
  $("#app").innerHTML = `<div class="destaques">${cards}</div>` + html.join("");
}

function abrir(id){
  const i = porId[id]; if (!i) return;
  $("#folha").innerHTML = `
    ${i.foto ? `<div class="ft"><img src="fotos/${i.foto}" alt="${esc(i.nome)}"></div>` : `<div class="ft sem">Pastel do Michel</div>`}
    <div class="tx"><div class="cat">${esc(i.cat)}</div><h3>${esc(i.nome)}</h3>${i.desc ? `<p>${esc(i.desc)}</p>` : ""}</div>
    <div class="linha">${preco(i.preco)}<button class="btn" id="fechar">Ver cardápio</button></div>`;
  $("#foco").classList.add("on");
  $("#fechar").onclick = fechar;
  document.querySelectorAll(".item.alvo").forEach(e => e.classList.remove("alvo"));
  document.getElementById(id)?.classList.add("alvo");
}
function fechar(){
  $("#foco").classList.remove("on");
  const id = location.hash.slice(1);
  const el = porId[id] && document.getElementById(id);
  if (el) el.scrollIntoView({block:"center"});
}

function rota(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (porId[id]) { abrir(id); document.getElementById(id)?.scrollIntoView({block:"center"}); }
  else { $("#foco").classList.remove("on"); if (id) document.getElementById(id)?.scrollIntoView(); }
}

montar();
$("#foco").addEventListener("click", e => { if (e.target.id === "foco") fechar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
window.addEventListener("hashchange", rota);
rota();

// categoria ativa na barra
const links = [...document.querySelectorAll("nav a")];
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("ativo", a.dataset.sec === e.target.id));
  const a = links.find(a => a.dataset.sec === e.target.id);
  a?.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
}), {rootMargin:"-80px 0px -70% 0px"});
document.querySelectorAll("section").forEach(s => obs.observe(s));
</script>
</body>
</html>
